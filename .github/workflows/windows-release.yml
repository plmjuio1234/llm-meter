name: Windows 11 Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag"
        required: true
        default: "v1.2.0-windows11-exe-preview"
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      CONFIGURATION: Release
      PLATFORM: x64
      ARTIFACT_ROOT: ${{ github.workspace }}\Windows\Artifacts

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify .NET SDK
        shell: pwsh
        run: dotnet --version

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Test portable Windows core
        run: dotnet test Windows/tests/LLMMeter.Core.Tests/LLMMeter.Core.Tests.csproj --configuration $env:CONFIGURATION

      - name: Publish standalone dashboard
        shell: pwsh
        run: |
          $artifactRoot = $env:ARTIFACT_ROOT
          $publishRoot = Join-Path $artifactRoot "App"
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          msbuild Windows/src/LLMMeter.App/LLMMeter.App.csproj `
            /restore `
            /t:Publish `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:PlatformTarget=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsPackageType=None `
            /p:EnableMsixTooling=false `
            /p:WindowsAppSDKSelfContained=true `
            /p:PublishSingleFile=false `
            /p:PublishDir="$publishRoot\"

          $application = Get-ChildItem $publishRoot -Filter "LLMMeter.App.exe" -File
          if ($null -eq $application) {
            throw "The standalone dashboard executable was not published."
          }
          $packagedFiles = Get-ChildItem $publishRoot -Recurse -File |
            Where-Object { $_.Extension -in ".msix", ".msixbundle", ".appx", ".appxbundle", ".cer" }
          if ($packagedFiles.Count -gt 0) {
            throw "The standalone payload contains package or certificate files."
          }

      - name: Assemble installable Windows bundle
        shell: pwsh
        run: |
          $artifactRoot = $env:ARTIFACT_ROOT
          Copy-Item ".github/windows/README-Windows11.txt" $artifactRoot -Force

          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "windows-build-$env:GITHUB_RUN_NUMBER"
          }
          $zipPath = Join-Path $artifactRoot "LLMMeter-Windows11-$tag.zip"
          Compress-Archive -Path (Join-Path $artifactRoot "App\*"), `
            (Join-Path $artifactRoot "README-Windows11.txt") `
            -DestinationPath $zipPath `
            -Force
          $hash = Get-FileHash $zipPath -Algorithm SHA256
          "$($hash.Hash)  $([IO.Path]::GetFileName($zipPath))" |
            Set-Content (Join-Path $artifactRoot "$([IO.Path]::GetFileName($zipPath)).sha256")
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "LLM Meter $tag" `
              --notes "Windows 11 preview build. This archive contains a self-contained unpackaged x64 WinUI dashboard EXE. It requires no MSIX package or certificate installation." `
              --prerelease
          }
          gh release edit $tag `
            --repo $env:GITHUB_REPOSITORY `
            --title "LLM Meter $tag" `
            --notes "Windows 11 preview build. This archive contains a self-contained unpackaged x64 WinUI dashboard EXE. It requires no MSIX package or certificate installation. OpenAI and Anthropic browser OAuth connections are included; live provider validation remains provider/account dependent."
          $assets = Get-ChildItem $env:ARTIFACT_ROOT -File |
            Where-Object { $_.Extension -in ".zip", ".sha256" }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
          }
